<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERACIONES BASICAS</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>

<body>

    <header>

        <h1>OPERACIONES BASICAS</h1>

    </header>

    <main class="container">
        <div class="row justify-content-center align-items-center g-2">
            <div class="col-sm-3">
                SUMA
                <div class="form-floating mb-3">
                    <input type="number" class="form-control" id="txt_numero1" placeholder="0.00">
                    <label for="txt_numero1">INGRESE NÚMERO 1</label>
                </div>
                <div class="form-floating">
                    <input type="number" class="form-control" id="txt_numero2" placeholder="0.00">
                    <label for="txt_numero2">INGRESE NÚMERO 2</label>
                </div>

                <div class="d-grid gap-2 mt-2">
                    <button type="button" id="btn_sumar" class="btn btn-primary">
                        SUMAR
                    </button>
                </div>
                <h1 id="txt_resultado_suma"></h1>

            </div>
            <div class="col-sm-3">
                RESTA

                <div class="form-floating mb-3">
                    <input type="number" class="form-control" id="txt_numero1_resta" placeholder="0.00">
                    <label for="txt_numero1_resta">INGRESE NÚMERO 1</label>
                </div>
                <div class="form-floating">
                    <input type="number" class="form-control" id="txt_numero2_resta" placeholder="0.00">
                    <label for="txt_numero2_resta">INGRESE NÚMERO 2</label>
                </div>

                <div class="d-grid gap-2 mt-2">
                    <button type="button" id="btn_restar" class="btn btn-primary">
                        RESTAR
                    </button>
                </div>
                <h1 id="txt_resultado_resta"></h1>

            </div>
            <div class="col-sm-3">
                MULTIPLICACION

                <div class="form-floating mb-3">
                    <input type="number" class="form-control" id="txt_numero1_multiplicacion" placeholder="0.00">
                    <label for="txt_numero1_multiplicacion">INGRESE NÚMERO 1</label>
                </div>
                <div class="form-floating">
                    <input type="number" class="form-control" id="txt_numero2_multiplicacion" placeholder="0.00">
                    <label for="txt_numero2_multiplicacion">INGRESE NÚMERO 2</label>
                </div>

                <div class="d-grid gap-2 mt-2">
                    <button type="button" id="btn_multiplicar" class="btn btn-primary">
                        MULTIPLICAR
                    </button>
                </div>
                <h1 id="txt_resultado_multiplicacion"></h1>

            </div>
            <div class="col-sm-3">
                DIVISION

                <div class="form-floating mb-3">
                    <input type="number" class="form-control" id="txt_numero1_division" placeholder="0.00">
                    <label for="txt_numero1_division">INGRESE NÚMERO 1</label>
                </div>
                <div class="form-floating">
                    <input type="number" class="form-control" id="txt_numero2_division" placeholder="0.00">
                    <label for="txt_numero2_division">INGRESE NÚMERO 2</label>
                </div>

                <div class="d-grid gap-2 mt-2">
                    <button type="button" id="btn_dividir" class="btn btn-primary">
                        DIVIDIR
                    </button>
                </div>
                <h1 id="txt_resultado_division"></h1>

            </div>
        </div>

        <a href="./Temperatura.html">
            ir a la pagina de temperaturas
        </a>


    </main>

    <footer>
        c 2025 ESPE
    </footer>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="./public/js/sumar.js"></script>
    <script src="./public/js/restar.js"></script>
    <script src="./public/js/multiplicar.js"></script>
    <script src="./public/js/dividir.js"></script>

</body>

</html>
