<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        OBJETOS
    </title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">

</head>

<body class="bg-dark text-white text-center">


    <header>

    </header>
    <main>

        <div class="container">
            <h1>
                OBJETOS EN JS
            </h1>
            <hr>
            <div id="datos_persona">


            </div>

            <hr>
            <div class="row g-3">
                <!-- nombres -->
                <div class="col-md-6">
                    <label for="txt_nombres" class="form-label">NOMBRES</label>
                    <input type="text" class="form-control" id="txt_nombres" autofocus>
                </div>

                <!-- Apellidos -->
                <div class="col-md-6">
                    <label for="txt_apellidos" class="form-label">APELLIDOS</label>
                    <input type="text" class="form-control" id="txt_apellidos">
                </div>

                <!-- edad -->
                <div class="col-md-6">
                    <label for="txt_edad" class="form-label">EDAD</label>
                    <input type="number" class="form-control" id="txt_edad">
                </div>

                <!-- profesor -->
                <div class="col-md-4">
                    <label for="select_es_profesor" class="form-label">ES PROFESOR</label>
                    <select id="select_es_profesor" class="form-select">
                        <option value="" selected disabled> SELECCIONE... </option>
                        <option value="si" > SI</option>
                        <option value="no">NO</option>
                    </select>
                </div>

                <!-- estatura -->
                <div class="col-md-2">
                    <label for="txt_estatura" class="form-label">ESTATURA</label>
                    <input type="text" class="form-control" id="txt_estatura">
                </div>


                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="check_mayor_edad">
                        <label class="form-check-label" for="check_mayor_edad">
                            ES MAYOR DE EDAD
                        </label>
                    </div>
                </div>


                <div class="col-12">
                    <button type="button" class="btn btn-primary" id="btn_actualizar">ACTUALIZAR</button>
                </div>
            </div>

        </div>
    </main>
    <footer>

    </footer>





    <script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="./public/js/objetos.js"></script>
</body>

</html>
